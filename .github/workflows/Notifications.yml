
name: TaurusTLS GitHub Notifications

on:
  pull_request:
    types: [opened, reopened, closed, review_requested]
    branches:
      - main

  issues:
    types: [opened, reopened, closed]

  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest

    # GitHub treats PR comments as issue comments.
    # Skip comments on pull requests.
    if: ${{ github.event_name != 'issue_comment' || !github.event.issue.pull_request }}

    steps:
      - name: Build and Sanitize Telegram Payload
        id: payload
        shell: python
        run: |
          import html
          import inspect
          import json
          import os
          import uuid

          # Read GitHub event data directly to avoid shell injection.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          event_name = os.environ["GITHUB_EVENT_NAME"]
          action = event.get("action", "")
          repository = event["repository"]["full_name"]

          if event_name == "pull_request":
              pr = event["pull_request"]
              title = f"Pull Request {action}"
              subject = pr["title"]
              url = pr["html_url"]
              author = pr["user"]["login"]

          elif event_name == "issues":
              issue = event["issue"]
              title = f"Issue {action}"
              subject = issue["title"]
              url = issue["html_url"]
              author = issue["user"]["login"]

          elif event_name == "issue_comment":
              issue = event["issue"]
              comment = event["comment"]
              title = f"New Comment on Issue #{issue['number']}"
              subject = issue["title"]
              url = comment["html_url"]
              author = comment["user"]["login"]

          else:
              title = f"Event Triggered: {event_name}"
              subject = repository
              url = event["repository"]["html_url"]
              author = os.environ["GITHUB_ACTOR"]

          # Escape values for Telegram HTML formatting.
          title = html.escape(title)
          subject = html.escape(subject)
          author = html.escape(author)
          repository = html.escape(repository)
          url = html.escape(url, quote=True)

          message = inspect.cleandoc(f"""
              <b>🛠️ TaurusTLS GitHub Notification</b>

              <b>Event:</b> {title}
              <b>Subject:</b> {subject}
              <b>Repository:</b> <code>{repository}</code>
              <b>Triggered by:</b> @{author}

              <a href="{url}">🔗 View on GitHub</a>
          """)

          # Use a unique delimiter for multiline GitHub Actions output.
          delimiter = f"EOF_{uuid.uuid4().hex}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"message<<{delimiter}\n")
              f.write(message + "\n")
              f.write(f"{delimiter}\n")

      - name: Send Telegram Message
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: ${{ steps.payload.outputs.message }}
