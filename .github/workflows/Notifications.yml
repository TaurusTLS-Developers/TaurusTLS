name: TaurusTLS GitHub Notifications

on:
  pull_request:
    types: [opened, reopened, closed, review_requested]
    branches:
      - main
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    # Skip job if it's a comment on a PR (GitHub treats PRs as issues for comments)
    if: ${{ github.event_name != 'issue_comment' || !github.event.issue.pull_request }}
    
    steps:
      - name: Set Event Details
        id: event-info
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "TITLE=Pull Request ${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "SUBJECT=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            
          elif [ "${{ github.event_name }}" == "issues" ]; then
            echo "TITLE=Issue ${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "SUBJECT=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.issue.html_url }}" >> $GITHUB_OUTPUT
            echo "AUTHOR=${{ github.event.issue.user.login }}" >> $GITHUB_OUTPUT
            
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "TITLE=New Comment on Issue #${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "SUBJECT=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.comment.html_url }}" >> $GITHUB_OUTPUT
            echo "AUTHOR=${{ github.event.comment.user.login }}" >> $GITHUB_OUTPUT
            
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "TITLE=CI Build Failed" >> $GITHUB_OUTPUT
            echo "SUBJECT=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
            echo "AUTHOR=GitHub Actions" >> $GITHUB_OUTPUT
            
          else
            echo "TITLE=Event Triggered: ${{ github.event_name }}" >> $GITHUB_OUTPUT
            echo "SUBJECT=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "URL=https://github.com/${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "AUTHOR=${{ github.actor }}" >> $GITHUB_OUTPUT
          fi
          
      - name: Build and Sanitize Telegram Payload
        id: payload
        env:
          RAW_TITLE: ${{ steps.event-info.outputs.TITLE }}
          RAW_SUBJECT: ${{ steps.event-info.outputs.SUBJECT }}
          RAW_AUTHOR: ${{ steps.event-info.outputs.AUTHOR }}
          REPO_NAME: ${{ github.event.repository.name }}
          URL: ${{ steps.event-info.outputs.URL }}
        run: |
          import html
          import inspect
          import os

          # Fetch raw inputs safely
          title = html.escape(os.environ.get("RAW_TITLE", ""))
          subject = html.escape(os.environ.get("RAW_SUBJECT", ""))
          author = html.escape(os.environ.get("RAW_AUTHOR", ""))
          repo = os.environ.get("REPO_NAME", "")
          url = os.environ.get("URL", "")

          # Indent naturally! Your editor will be happy now.
          raw_message = f"""
          <b>🛠️ TaurusTLS GitHub Notification</b>

          <b>Event:</b> {title}
          <b>Subject:</b> {subject}
          <b>Repository:</b> <code>TaurusTLS/{repo}</code>
          <b>Triggered by:</b> @{author}

          <a href="{url}">🔗 View on GitHub</a>
          """

          # Clean up the leading whitespace automatically
          message = inspect.cleandoc(raw_message)

          # Export the finalized payload string
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("message<<EOF\n")
              f.write(message + "\n")
              f.write("EOF\n")

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: ${{ steps.payload.outputs.message }}
