
name: TaurusTLS GitHub Notifications

on:
  push:
    branches:
      - test/telegram-notifications
      
  pull_request_target:
    types: [opened, reopened, closed, review_requested]
    branches:
      - main

  issues:
    types: [opened, reopened, closed]

  issue_comment:
    types: [created]

# No GitHub API permissions required.
permissions: {}

jobs:
  notify-telegram:
    runs-on: ubuntu-latest

    # GitHub treats PR comments as issue comments.
    # Skip comments on pull requests.
    if: ${{ github.event_name != 'issue_comment' || !github.event.issue.pull_request }}

    steps:
      - name: Send Telegram Notification
        shell: python
        env:
          TELEGRAM_TOKEN: ${{ secrets.TLG_BOT_TKN_TAURUSTLSDEV_BOT }}
          TELEGRAM_TO: ${{ secrets.TLG_CHAT_ID_TAURUSTLS_ALERTS }}
          TELEGRAM_THREAD: ${{ vars.TLG_THRD_ID_TAURUSTLS_ALERTS }}

        run: |
          import html
          import inspect
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          # Read event data without shell interpolation.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          event_name = os.environ["GITHUB_EVENT_NAME"]
          action = event.get("action", "")
          repository = event["repository"]["full_name"]

          if event_name == "push":
              title = "Workflow Test"
              subject = "Testing Telegram notifications from feature branch"
              url = event["repository"]["html_url"]
              author = os.environ["GITHUB_ACTOR"]
          
          elif event_name == "pull_request_target":
              pr = event["pull_request"]
              title = f"Pull Request {action}"
              subject = pr["title"]
              url = pr["html_url"]
              author = pr["user"]["login"]

          elif event_name == "issues":
              issue = event["issue"]
              title = f"Issue {action}"
              subject = issue["title"]
              url = issue["html_url"]
              author = issue["user"]["login"]

          elif event_name == "issue_comment":
              issue = event["issue"]
              comment = event["comment"]
              title = f"New Comment on Issue #{issue['number']}"
              subject = issue["title"]
              url = comment["html_url"]
              author = comment["user"]["login"]

          else:
              sys.exit(f"Unsupported event: {event_name}")

          # Limit subject length to prevent Telegram message-size errors.
          if len(subject) > 1000:
              subject = subject[:997] + "..."

          # Escape user-supplied content for Telegram HTML.
          title = html.escape(title)
          subject = html.escape(subject)
          author = html.escape(author)
          repository = html.escape(repository)
          url = html.escape(url, quote=True)

          message = inspect.cleandoc(f"""
              <b>🛠️ TaurusTLS GitHub Notification</b>

              <b>Event:</b> {title}
              <b>Subject:</b> {subject}
              <b>Repository:</b> <code>{repository}</code>
              <b>Triggered by:</b> @{author}

              <a href="{url}">🔗 View on GitHub</a>
          """)

          # Validate configuration.
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_TO")
          message_thread_id = os.environ.get("TELEGRAM_THREAD")

          if not token or not chat_id:
              sys.exit("Missing Telegram token or chat ID.")

          # Prepare Telegram Bot API request.
          payload = {
              "chat_id": chat_id,
              "message_thread_id": message_thread_id,
              "text": message,
              "parse_mode": "HTML",
              "link_preview_options": {
                  "is_disabled": True
              },
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url=f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          # Send the notification.
          # Avoid printing exception URLs because they contain the token.
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)

              if not result.get("ok"):
                  sys.exit("Telegram API rejected the notification.")

              print("Telegram notification sent successfully.")

          except urllib.error.HTTPError as error:
              print(
                  f"Telegram API returned HTTP {error.code}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          except urllib.error.URLError:
              sys.exit("Unable to connect to Telegram API.")

          except TimeoutError:
              sys.exit("Telegram API request timed out.")
